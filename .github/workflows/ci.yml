name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  RAYON_NUM_THREADS: "4"
  JAX_PLATFORMS: "cpu"
  FLEXMESA_REQUIRE_ZERO_SKIPS: "1"

jobs:
  # Decides which job groups this run needs (`scripts/ci/select_jobs.py`,
  # `DECISIONS #48`). Everything runs on `main` and on any pull request that
  # touches more than documentation or test files.
  changes:
    name: Select Jobs From Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      python: ${{ steps.select.outputs.python }}
      engine_runs: ${{ steps.select.outputs.engine_runs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          else
            : > changed.txt
          fi
          cat changed.txt
          python3 scripts/ci/select_jobs.py --event "${{ github.event_name }}" --paths-file changed.txt | tee -a "$GITHUB_OUTPUT"

  rust-lint:
    name: Rust Clippy & rustdoc
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain and verified data bundles
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-python-pkg: "false"

      - name: Run Cargo Clippy and rustdoc
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --exclude flexmesa-py

  # The Rust tests run as seven shards. `star`, `astero` and `binary` are
  # each split in two by `scripts/ci/cargo_test_shard.py`, which assigns
  # every test target of the package to exactly one shard
  # (`tests/test_ci_shards.py` checks this); `rest` is every other package.
  # Together the shards cover exactly `--workspace --exclude flexmesa-py`.
  # They build with `--profile ci` (`Cargo.toml`): the release profile
  # without link-time optimisation.
  rust-tests:
    name: Safe Rust Tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: star 1/2
            package: flexmesa-star
            index: 1
          - shard: star 2/2
            package: flexmesa-star
            index: 2
          - shard: astero 1/2
            package: flexmesa-astero
            index: 1
          - shard: astero 2/2
            package: flexmesa-astero
            index: 2
          - shard: binary 1/2
            package: flexmesa-binary
            index: 1
          - shard: binary 2/2
            package: flexmesa-binary
            index: 2
          - shard: rest
            packages: >-
              --workspace --exclude flexmesa-py --exclude flexmesa-star
              --exclude flexmesa-astero --exclude flexmesa-binary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain and verified data bundles
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-python-pkg: "false"
          rust-cache-key: ci-tests-${{ matrix.package || 'rest' }}

      - name: Run Safe Rust unit, integration, and doc tests (${{ matrix.shard }})
        run: |
          if [ -n "${{ matrix.package }}" ]; then
            python3 scripts/ci/cargo_test_shard.py --package "${{ matrix.package }}" --index "${{ matrix.index }}" --total 2
          else
            cargo test ${{ matrix.packages }} --profile ci
          fi

  rust:
    name: Safe Rust Workspace & Golden Oracles
    if: ${{ !cancelled() }}
    needs: [changes, rust-lint, rust-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Clippy, rustdoc and every Rust test shard to pass
        run: |
          # "skipped" means the change cannot affect Rust (see `changes`),
          # which is only believed when the selection job itself succeeded.
          test "${{ needs.changes.result }}" = "success"
          for r in "${{ needs.rust-lint.result }}" "${{ needs.rust-tests.result }}"; do
            test "$r" = "success" || test "$r" = "skipped"
          done

  # The Python suite, including the end-to-end files, runs as six shards. `scripts/ci/pytest_shard.py`
  # assigns every collected test file to exactly one shard
  # (`tests/test_ci_shards.py` checks this).
  python-jax-tests:
    name: Python, PyO3 & JAX Tests (shard ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up FlexMESA (debug + JAX cache)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "false"
          cache-jax: "true"

      - name: Run Python, PyO3, and JAX parity tests (shard ${{ matrix.shard }}/6)
        run: |
          pytest $(python scripts/ci/pytest_shard.py --index ${{ matrix.shard }} --total 6) -v --durations=15

  python-jax:
    name: Python, PyO3 & JAX Parity Suite
    if: ${{ !cancelled() }}
    needs: [changes, python-jax-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python shard to pass
        run: |
          test "${{ needs.changes.result }}" = "success"
          r="${{ needs.python-jax-tests.result }}"
          test "$r" = "success" || test "$r" = "skipped"

  docs:
    name: Ruff, Figures, MkDocs (Strict) & Snippets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up FlexMESA (docs, linters, JAX cache)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test,docs]"'
          extra-pip-packages: 'mkdocs-material "mkdocstrings[python]" "ruff==0.16.2" "mypy==2.3.0"'
          release: "false"
          cache-jax: "true"

      - name: Clean-room fetch and per-file SHA-256 verification of all data-v1 bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flexmesa data verify --include-test-inputs
          flexmesa data clean-cache --purge-legacy-in-data
          CLEAN_ROOT="${{ runner.temp }}/flexmesa-clean-provenance"
          python -c 'import pathlib, shutil, sys; shutil.rmtree(pathlib.Path(sys.argv[1]), ignore_errors=True)' "$CLEAN_ROOT"
          test ! -e "$CLEAN_ROOT"
          FLEXMESA_DATA_DIR="$CLEAN_ROOT/data" \
          FLEXMESA_CACHE_DIR="$CLEAN_ROOT/derived" \
          MESA_DIR="$CLEAN_ROOT/mesa_test_inputs" \
          FLEXMESA_HISTORIES_DIR="$CLEAN_ROOT/mesa_histories" \
          FLEXMESA_MODULE_HEX_DIR="$CLEAN_ROOT/mesa_module_hex" \
            flexmesa data fetch --include-test-inputs
          FLEXMESA_DATA_DIR="$CLEAN_ROOT/data" \
          FLEXMESA_CACHE_DIR="$CLEAN_ROOT/derived" \
          MESA_DIR="$CLEAN_ROOT/mesa_test_inputs" \
          FLEXMESA_HISTORIES_DIR="$CLEAN_ROOT/mesa_histories" \
          FLEXMESA_MODULE_HEX_DIR="$CLEAN_ROOT/mesa_module_hex" \
            flexmesa data verify --include-test-inputs
          FLEXMESA_DATA_DIR="$CLEAN_ROOT/data" \
          FLEXMESA_CACHE_DIR="$CLEAN_ROOT/derived" \
          MESA_DIR="$CLEAN_ROOT/mesa_test_inputs" \
          FLEXMESA_HISTORIES_DIR="$CLEAN_ROOT/mesa_histories" \
          FLEXMESA_MODULE_HEX_DIR="$CLEAN_ROOT/mesa_module_hex" \
            flexmesa data clean-cache --purge-legacy-in-data
          python -c 'import pathlib, shutil, sys; shutil.rmtree(pathlib.Path(sys.argv[1]))' "$CLEAN_ROOT"

      - name: Run Ruff formatter, linter, and Mypy strict type checker
        run: |
          ruff format --check --line-length 80 src tests scripts/docs scripts/audit/diff_mesa_defaults.py scripts/audit/mesa_terminations.py scripts/audit/case_budgets.py scripts/data/build_physics_bundles.py scripts/check_strict_determinism.py scripts/mesa_reference/measure_mesa_spread.py
          ruff check src tests scripts/docs scripts/audit/diff_mesa_defaults.py scripts/audit/mesa_terminations.py scripts/audit/case_budgets.py scripts/data/build_physics_bundles.py scripts/check_strict_determinism.py scripts/mesa_reference/measure_mesa_spread.py
          mypy --strict src tests scripts/docs scripts/audit/diff_mesa_defaults.py scripts/audit/mesa_terminations.py scripts/audit/case_budgets.py scripts/data/build_physics_bundles.py scripts/check_strict_determinism.py scripts/mesa_reference/measure_mesa_spread.py

      - name: Verify bijective known-gaps and Level-2 module hex gates
        run: |
          python -m flexmesa.testing.known_gaps_gate --fail-on-imperative-skips
          python -m flexmesa.testing.module_hex_gate --check-summary
          python scripts/audit/diff_mesa_defaults.py --check --enforce

      - name: Verify generated documentation pages and port manifest dashboard
        run: |
          python scripts/docs/render_known_gaps_page.py --check
          python scripts/docs/render_coverage_map_page.py --check
          python scripts/docs/render_pgstar_coverage.py --check
          python scripts/audit/render_extras_status.py --check
          python scripts/audit/mesa_terminations.py --check
          python scripts/audit/case_budgets.py --check
          python scripts/docs/render_benchmark_pages.py --check
          python scripts/dashboard/build_routine_table.py --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            flexmesa dashboard check --no-outputs --base-ref "origin/${{ github.base_ref }}"
          else
            flexmesa dashboard check --no-outputs
          fi

      - name: Build diagnostic figures, MkDocs site, and verify snippets
        run: |
          python scripts/build_docs_figures.py
          mkdocs build --strict --site-dir site
          pytest tests/test_docs_snippets.py tests/test_mesa_paper_figures.py tests/test_dashboard.py -v

  history-harness-unit:
    name: History Harness Unit Suite
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "true"

      - name: Run harness unit suite and verify generated case table
        run: |
          pytest tests/test_history_harness.py -v --durations=15

  history-harness:
    name: Upstream History Harness (PR Subset)
    needs: changes
    if: needs.changes.outputs.engine_runs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "true"

      - name: Run PR uncapped trajectory subset
        run: |
          OUT_DIR="${{ runner.temp }}/flexmesa-pr-harness"
          mkdir -p "$OUT_DIR"
          flexmesa harness run \
            --preset pr-ci \
            --enforce-step-counts \
            --jobs 2 \
            --timeout-sec 480 \
            --max-rss-gb 6.0 \
            --work-dir "$OUT_DIR/logs" \
            --markdown-out "$OUT_DIR/case_table.md" \
            --json-out "$OUT_DIR/case_table.json" \
            --gate

      - name: Upload PR trajectory table and histories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-history-harness-artifacts
          if-no-files-found: ignore
          path: ${{ runner.temp }}/flexmesa-pr-harness/

  strict-determinism:
    name: Strict Cross-Machine & Thread Determinism (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.engine_runs == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # DECISIONS #81: macOS bit-identity runs on train PRs and manual
        # runs; the nightly campaign checks it uncapped on main. Other
        # pushes compare 1 and 4 threads on Linux only.
        os: ${{ fromJSON((startsWith(github.head_ref, 'train-') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: "-e ."
          release: "true"

      - name: Run crlibm FFI and MESA 26.4.1 reference-vector tests
        run: |
          cargo test -p flexmesa-crlibm-sys -p flexmesa-math --release

      - name: Compute strict vector and 1-vs-4-thread evolution SHA-256 digests
        run: |
          OUT_JSON="${{ runner.temp }}/strict_${{ runner.os }}_${{ runner.arch }}.json"
          python scripts/check_strict_determinism.py --json-out "$OUT_JSON"

      - name: Upload strict determinism digest
        uses: actions/upload-artifact@v7
        with:
          name: strict-determinism-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/strict_${{ runner.os }}_${{ runner.arch }}.json

  strict-cross-machine-gate:
    name: Strict x86_64 vs aarch64 Bit-Identity Gate
    needs: strict-determinism
    if: startsWith(github.head_ref, 'train-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download strict determinism digests
        uses: actions/download-artifact@v8
        with:
          pattern: strict-determinism-*
          merge-multiple: true
          path: ${{ runner.temp }}/strict-digests

      - name: Verify identical strict SHA-256 across x86_64 and aarch64
        run: |
          python scripts/check_strict_determinism.py --compare "${{ runner.temp }}"/strict-digests/strict_*.json

  # DECISIONS #81 (T1): a train PR re-runs the passing cases projected to
  # finish within 600 s, uncapped, with step counts enforced and the
  # baseline gate. The full campaign is the nightly run on main.
  train-canary-shard:
    name: Train Canary (shard ${{ matrix.shard }}/8)
    needs: changes
    if: >-
      needs.changes.outputs.engine_runs == 'true' &&
      (startsWith(github.head_ref, 'train-') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "true"

      - name: Run one canary shard
        run: |
          OUT_DIR="${{ runner.temp }}/canary-shard"
          mkdir -p "$OUT_DIR"
          flexmesa harness run \
            --preset canary \
            --numerics-mode strict \
            --enforce-step-counts \
            --shard "${{ matrix.shard }}/8" \
            --jobs 2 \
            --timeout-sec 1200 \
            --case-budgets benchmarks/history_harness/case_budgets.toml \
            --max-rss-gb 5.5 \
            --work-dir "$OUT_DIR/logs" \
            --json-out "$OUT_DIR/shard_${{ matrix.shard }}.json"

      - name: Upload canary shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-canary-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/canary-shard/

  train-canary:
    name: Train Canary (merge and gate)
    needs: train-canary-shard
    if: always() && needs.train-canary-shard.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "true"

      - name: Download canary shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: train-canary-shard-*
          path: ${{ runner.temp }}/canary-shards

      - name: Merge canary shards and gate against the baseline
        run: |
          OUT_DIR="${{ runner.temp }}/canary"
          mkdir -p "$OUT_DIR"
          shopt -s nullglob
          REPORTS=("${{ runner.temp }}"/canary-shards/*/shard_*.json)
          if [ "${#REPORTS[@]}" -ne 8 ]; then
            echo "expected 8 canary shard reports, found ${#REPORTS[@]}" >&2
            exit 1
          fi
          flexmesa harness merge "${REPORTS[@]}" \
            --markdown-out "$OUT_DIR/case_table.md" \
            --json-out "$OUT_DIR/case_table.json" \
            --gate
          cat "$OUT_DIR/case_table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary case table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-canary-artifacts
          if-no-files-found: ignore
          path: ${{ runner.temp }}/canary/
