name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  RAYON_NUM_THREADS: "4"
  JAX_PLATFORMS: "cpu"
  FLEXMESA_REQUIRE_ZERO_SKIPS: "1"

jobs:
  rust:
    name: Safe Rust Workspace & Golden Oracles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain and verified data bundles
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-python-pkg: "false"

      - name: Run Cargo Clippy and rustdoc
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --exclude flexmesa-py

      - name: Run Safe Rust unit, integration, and doc tests
        run: |
          cargo test --workspace --exclude flexmesa-py --release
          cargo test --workspace --exclude flexmesa-py --doc

  python-jax:
    name: Python, PyO3 & JAX Parity Suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up FlexMESA (debug + JAX cache)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "false"
          cache-jax: "true"

      - name: Run Python, PyO3, and JAX parity tests
        run: |
          pytest src tests \
            --ignore=tests/test_docs_snippets.py \
            --ignore=tests/test_mesa_paper_figures.py \
            --ignore=tests/test_history_harness.py \
            --ignore-glob="tests/test_e2e_*.py" \
            -v

  e2e:
    name: Upstream MESA End-to-End Suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up FlexMESA (debug + JAX cache)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "false"
          cache-jax: "true"

      - name: Run upstream MESA Tier 1-5 and dev_cases E2E suites
        run: pytest tests/test_e2e_*.py -v

  docs:
    name: Ruff, Figures, MkDocs (Strict) & Snippets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up FlexMESA (docs, linters, JAX cache)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test,docs]"'
          extra-pip-packages: 'mkdocs-material "mkdocstrings[python]" "ruff==0.16.2" "mypy==2.3.0"'
          release: "false"
          cache-jax: "true"

      - name: Run Ruff formatter, linter, and Mypy strict type checker
        run: |
          ruff format --check --line-length 80 src tests scripts/docs scripts/check_strict_determinism.py scripts/mesa_reference/measure_mesa_spread.py
          ruff check src tests scripts/docs scripts/check_strict_determinism.py scripts/mesa_reference/measure_mesa_spread.py
          mypy --strict src tests scripts/docs scripts/check_strict_determinism.py scripts/mesa_reference/measure_mesa_spread.py

      - name: Verify bijective known-gaps and Level-2 module hex gates
        run: |
          python -m flexmesa.testing.known_gaps_gate --fail-on-imperative-skips
          python -m flexmesa.testing.module_hex_gate --check-summary

      - name: Verify generated documentation pages and port manifest dashboard
        run: |
          python scripts/docs/render_known_gaps_page.py --check
          python scripts/docs/render_coverage_map_page.py --check
          python scripts/docs/render_benchmark_pages.py --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            flexmesa dashboard check --base-ref "origin/${{ github.base_ref }}"
          else
            flexmesa dashboard check
          fi

      - name: Build diagnostic figures, MkDocs site, and verify snippets
        run: |
          python scripts/build_docs_figures.py
          mkdocs build --strict --site-dir site
          pytest tests/test_docs_snippets.py tests/test_mesa_paper_figures.py tests/test_dashboard.py -v

  history-harness:
    name: Upstream History Harness (PR Subset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: '-e ".[test]"'
          release: "true"

      - name: Run harness unit suite and verify generated case table
        run: |
          pytest tests/test_history_harness.py -v

      - name: Run PR uncapped trajectory subset
        run: |
          OUT_DIR="${{ runner.temp }}/flexmesa-pr-harness"
          mkdir -p "$OUT_DIR"
          flexmesa harness run \
            --preset pr-ci \
            --timeout-sec 480 \
            --max-rss-gb 6.0 \
            --work-dir "$OUT_DIR/logs" \
            --markdown-out "$OUT_DIR/case_table.md" \
            --json-out "$OUT_DIR/case_table.json" \
            --gate

      - name: Upload PR trajectory table and histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-history-harness-artifacts
          if-no-files-found: ignore
          path: ${{ runner.temp }}/flexmesa-pr-harness/

  strict-determinism:
    name: Strict Cross-Machine & Thread Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up FlexMESA (release)
        uses: ./.github/actions/setup-flexmesa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pip-spec: "-e ."
          release: "true"

      - name: Run crlibm FFI and MESA 26.4.1 reference-vector tests
        run: |
          cargo test -p flexmesa-crlibm-sys -p flexmesa-math --release

      - name: Compute strict vector and 1-vs-4-thread evolution SHA-256 digests
        run: |
          OUT_JSON="${{ runner.temp }}/strict_${{ runner.os }}_${{ runner.arch }}.json"
          python scripts/check_strict_determinism.py --json-out "$OUT_JSON"

      - name: Upload strict determinism digest
        uses: actions/upload-artifact@v4
        with:
          name: strict-determinism-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/strict_${{ runner.os }}_${{ runner.arch }}.json

  strict-cross-machine-gate:
    name: Strict x86_64 vs aarch64 Bit-Identity Gate
    needs: strict-determinism
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download strict determinism digests
        uses: actions/download-artifact@v4
        with:
          pattern: strict-determinism-*
          merge-multiple: true
          path: ${{ runner.temp }}/strict-digests

      - name: Verify identical strict SHA-256 across x86_64 and aarch64
        run: |
          python scripts/check_strict_determinism.py --compare "${{ runner.temp }}"/strict-digests/strict_*.json
