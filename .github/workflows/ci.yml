name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  RAYON_NUM_THREADS: "4"
  JAX_PLATFORMS: "cpu"
  FLEXMESA_REQUIRE_ZERO_SKIPS: "1"

jobs:
  rust:
    name: Safe Rust Workspace & Golden Oracles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"

      - name: Run Cargo Clippy and rustdoc
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --exclude flexmesa-py

      - name: Run Safe Rust unit, integration, and doc tests
        run: |
          cargo test --workspace --exclude flexmesa-py --release
          cargo test --workspace --exclude flexmesa-py --doc

  python-jax:
    name: Python, PyO3 & JAX Parity Suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Cache persistent JAX XLA compilation artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa-jax
          key: flexmesa-jax-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'src/flexmesa/**/*.py') }}
          restore-keys: |
            flexmesa-jax-${{ runner.os }}-py312-

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"
          echo "JAX_COMPILATION_CACHE_DIR=$HOME/.cache/flexmesa-jax" >> "$GITHUB_ENV"

      - name: Install FlexMESA and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run Python, PyO3, and JAX parity tests
        run: |
          pytest src tests \
            --ignore=tests/test_docs_snippets.py \
            --ignore=tests/test_mesa_paper_figures.py \
            --ignore=tests/test_history_harness.py \
            --ignore-glob="tests/test_e2e_*.py" \
            -v

  e2e:
    name: Upstream MESA End-to-End Suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Cache persistent JAX XLA compilation artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa-jax
          key: flexmesa-jax-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'src/flexmesa/**/*.py') }}
          restore-keys: |
            flexmesa-jax-${{ runner.os }}-py312-

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"
          echo "JAX_COMPILATION_CACHE_DIR=$HOME/.cache/flexmesa-jax" >> "$GITHUB_ENV"

      - name: Install FlexMESA and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run upstream MESA Tier 1-5 and dev_cases E2E suites
        run: pytest tests/test_e2e_*.py -v

  docs:
    name: Ruff, Figures, MkDocs (Strict) & Snippets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Cache persistent JAX XLA compilation artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa-jax
          key: flexmesa-jax-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'src/flexmesa/**/*.py') }}
          restore-keys: |
            flexmesa-jax-${{ runner.os }}-py312-

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"
          echo "JAX_COMPILATION_CACHE_DIR=$HOME/.cache/flexmesa-jax" >> "$GITHUB_ENV"

      - name: Install FlexMESA, linter, and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin ruff mkdocs-material "mkdocstrings[python]"
          python -m pip install --no-build-isolation -e ".[test,docs]"

      - name: Run Ruff formatter, linter, and Mypy strict type checker
        run: |
          ruff format --check --line-length 80 src tests
          ruff check src tests
          mypy --strict src tests

      - name: Verify port manifest, status-promotion rules, and generated dashboard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            flexmesa dashboard check --base-ref "origin/${{ github.base_ref }}"
          else
            flexmesa dashboard check
          fi

      - name: Build diagnostic figures, MkDocs site, and verify snippets
        run: |
          python scripts/build_docs_figures.py
          mkdocs build --strict --site-dir site
          pytest tests/test_docs_snippets.py tests/test_mesa_paper_figures.py tests/test_dashboard.py -v

  history-harness:
    name: Upstream History Harness (PR Subset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"

      - name: Install FlexMESA in release mode
        env:
          MATURIN_PEP517_ARGS: "--profile=release"
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run harness unit suite and verify generated case table
        run: |
          pytest tests/test_history_harness.py -v

      - name: Run PR uncapped trajectory subset
        run: |
          OUT_DIR="${{ runner.temp }}/flexmesa-pr-harness"
          mkdir -p "$OUT_DIR"
          flexmesa harness run \
            --preset pr-ci \
            --timeout-sec 480 \
            --max-rss-gb 6.0 \
            --work-dir "$OUT_DIR/logs" \
            --markdown-out "$OUT_DIR/case_table.md" \
            --json-out "$OUT_DIR/case_table.json" \
            --gate

      - name: Upload PR trajectory table and histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-history-harness-artifacts
          if-no-files-found: ignore
          path: ${{ runner.temp }}/flexmesa-pr-harness/

  coverage-rust:
    name: Rust Line Coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: llvm-cov

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"

      - name: Run cargo llvm-cov across Safe Rust workspace
        run: |
          bash scripts/dashboard/run_coverage.sh rust "${{ runner.temp }}/rust_cov.json"

      - name: Upload Rust coverage JSON summary
        uses: actions/upload-artifact@v4
        with:
          name: rust-llvm-cov-summary
          path: ${{ runner.temp }}/rust_cov.json

  coverage-python:
    name: Python Line Coverage (pytest --cov)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Cache persistent JAX XLA compilation artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/flexmesa-jax
          key: flexmesa-jax-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'src/flexmesa/**/*.py') }}
          restore-keys: |
            flexmesa-jax-${{ runner.os }}-py312-

      - name: Fetch verified data-v1 physics and MESA test bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"
          echo "JAX_COMPILATION_CACHE_DIR=$HOME/.cache/flexmesa-jax" >> "$GITHUB_ENV"

      - name: Install FlexMESA and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run Python and JAX suite under pytest --cov
        run: |
          bash scripts/dashboard/run_coverage.sh python "${{ runner.temp }}/python_cov.json"

      - name: Upload Python coverage JSON summary
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-cov-summary
          path: ${{ runner.temp }}/python_cov.json
