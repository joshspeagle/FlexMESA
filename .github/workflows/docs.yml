name: Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # DECISIONS #81: build the site on a pull request only when it can change
    # (ci.yml's docs job already runs mkdocs build --strict on every PR).
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "src/flexmesa/**"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  workflow_call:
    inputs:
      artifact_name:
        description: "Pages artifact name (unique per caller in a workflow run)"
        required: false
        type: string
        default: "github-pages"
      checkout_ref:
        description: "Optional git ref or commit SHA to build"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  RAYON_NUM_THREADS: "4"
  JAX_PLATFORMS: "cpu"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose

      - name: Cache Rust cargo target and registry
        uses: Swatinem/rust-cache@v2

      - name: Cache FlexMESA data-v1 and MESA test bundles
        uses: actions/cache@v6
        with:
          path: ~/.cache/flexmesa
          key: flexmesa-data-v1-${{ hashFiles('src/flexmesa/data/bundles.toml') }}

      - name: Fetch verified data-v1 physics bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          python3 src/flexmesa/data/fetch.py fetch --include-test-inputs
          echo "FLEXMESA_DATA_DIR=$HOME/.cache/flexmesa/data" >> "$GITHUB_ENV"
          echo "MESA_DIR=$HOME/.cache/flexmesa/mesa_test_inputs" >> "$GITHUB_ENV"

      - name: Install documentation and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.16.0" "ruff==0.16.2" matplotlib mkdocs-material "mkdocstrings[python]"
          python -m pip install --no-build-isolation -e ".[docs]"

      - name: Generate publication-styled diagnostic figures
        run: python scripts/build_docs_figures.py

      - name: Build MkDocs Material site
        run: mkdocs build --strict --site-dir site

      - name: Build Safe Rust API documentation (cargo doc)
        run: |
          cargo doc --workspace --no-deps --exclude flexmesa-py
          mkdir -p site/rustdoc
          cp -r target/doc/* site/rustdoc/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ inputs.artifact_name || 'github-pages' }}
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artifact_name || 'github-pages' }}
          timeout: 600000
