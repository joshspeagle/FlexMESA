name: Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install documentation and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin ruff matplotlib mkdocs-material "mkdocstrings[python]"
          python -m pip install --no-build-isolation -e .

      - name: Generate publication-styled diagnostic figures
        run: python scripts/build_docs_figures.py

      - name: Build MkDocs Material site
        run: mkdocs build --strict --site-dir site

      - name: Build Safe Rust API documentation (cargo doc)
        run: |
          cargo doc --workspace --no-deps --exclude flexmesa-py
          mkdir -p site/rustdoc
          cp -r target/doc/* site/rustdoc/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
