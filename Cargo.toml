[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Josh Speagle <j.speagle@utoronto.ca>"]
repository = "https://github.com/joshspeagle/FlexMESA"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
