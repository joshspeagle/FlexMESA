[workspace]
resolver = "2"
members = [
  "crates/flexmesa-testing",
  "crates/flexmesa-schema",
  "crates/flexmesa-data",
  "crates/flexmesa-const",
  "crates/flexmesa-utils",
  "crates/flexmesa-math",
  "crates/flexmesa-autodiff",
  "crates/flexmesa-interp1d",
  "crates/flexmesa-interp2d",
  "crates/flexmesa-mtx",
  "crates/flexmesa-num",
  "crates/flexmesa-neu",
  "crates/flexmesa-turb",
  "crates/flexmesa-chem",
  "crates/flexmesa-ionization",
  "crates/flexmesa-colors",
  "crates/flexmesa-eos",
  "crates/flexmesa-kap",
  "crates/flexmesa-rates",
  "crates/flexmesa-bench",
  "crates/flexmesa-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["Josh Speagle <j.speagle@utoronto.ca>"]
repository = "https://github.com/joshspeagle/FlexMESA"

[workspace.dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }
rayon = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 2
