[workspace]
resolver = "2"
members = [
  "crates/flexmesa-testing",
  "crates/flexmesa-schema",
  "crates/flexmesa-data",
  "crates/flexmesa-const",
  "crates/flexmesa-utils",
  "crates/flexmesa-crlibm-sys",
  "crates/flexmesa-math",
  "crates/flexmesa-autodiff",
  "crates/flexmesa-interp1d",
  "crates/flexmesa-interp2d",
  "crates/flexmesa-mtx",
  "crates/flexmesa-num",
  "crates/flexmesa-neu",
  "crates/flexmesa-turb",
  "crates/flexmesa-chem",
  "crates/flexmesa-ionization",
  "crates/flexmesa-colors",
  "crates/flexmesa-eos",
  "crates/flexmesa-kap",
  "crates/flexmesa-rates",
  "crates/flexmesa-atm",
  "crates/flexmesa-net",
  "crates/flexmesa-star",
  "crates/flexmesa-binary",
  "crates/flexmesa-astero",
  "crates/flexmesa-bench",
  "crates/flexmesa-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Josh Speagle <j.speagle@utoronto.ca>"]
repository = "https://github.com/joshspeagle/FlexMESA"

[workspace.dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# CI test profile: release optimisation without link-time optimisation, so
# the many integration-test binaries link in seconds rather than minutes.
# Shipped builds and the Python extension keep `release`.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
