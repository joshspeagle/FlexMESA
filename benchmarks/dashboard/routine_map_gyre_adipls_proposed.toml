# SPDX-License-Identifier: GPL-3.0-or-later
# Proposed GYRE and ADIPLS routine mappings for #610b (`DECISIONS #79`,
# `notes/audit/routine_map_reviews/610b.md`).
# Standalone proposal file: `port_manifest.toml` stays `status = "absent"`
# until script conversion alongside `notes/audit/routine_map_reviews/610b.toml`.
#
# Uniform grading rules applied across this proposal:
# - Rule A (fypp templates `${S}$`, `${suffix}$`, `${N}$`, `${S_X}$_${S_Y}$`):
#   graded `full` iff every template instance generated by the enclosing
#   `#:for` loop is ported (`bvp_m`, `discrim_m`, `colloc_diff_m::build_GL2`,
#   `magnus_diff_m::dOmega_GL2`, `block_sysmtx_m`, `linalg_m::eigen_decompose_2`,
#   `null_rot_m`); graded `partial` whenever any instance is unported (for
#   example `order_m`, `root_m`, `integ_m`, `math_m`, `ext_real_m`, `util_m`).
# - Rule B (`select type` dispatch): graded `full` iff every upstream type arm
#   is ported (`nad_diff_m::build`, `bracket_search_m::bracket_search`); graded
#   `partial` whenever any type arm is absent because that upstream type is not
#   ported (`wave_m::dW_dx`, `prox_search_m::prox_search_2_`,
#   `freq_context_m::freq_scale_context_`, `freq_m::freq_scale_model_`,
#   `mode_m::classify_`).
#
# Order: (1) GYRE core (`gyre_mesa_m`, `ad`/`rad`/`nad` BVP, search),
#        (2) ADIPLS `mdintg = 5` core,
#        (3) GYRE remaining support/math modules,
#        (4) ADIPLS remaining parser/solver/gensr helpers.

