# Mid-run MESA 26.4.1 step-dump windows worth keeping (#608).
#
# Each [[window]] is one run of run_stepdumps.py with
#   --stage S --occurrence K --first-model F --steps N --cases <case>
# (stage = the S-th process of the case that calls the solver; occurrence = the
# K-th time the model number rises to F). `regenerate_windows.py` runs them;
# `scripts/data/build_mesa_stepdump_windows.py` packs the outputs into the
# opt-in mesa-stepdump-windows bundle. A window is identified by
# (case, stage, occurrence, first_model, steps); its id is derived from those.
#
# `why` describes what the window covers. Windows whose reason reads "mid-run
# window for first-divergence bisection" or "step-count disagreements" were
# captured while localizing a FlexMESA/MESA difference; the case's own
# history is the record of which difference.

