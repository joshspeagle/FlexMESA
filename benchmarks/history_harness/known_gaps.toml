issue = "#153"
reason = "Strict run reaches exact MESA 26.4.1 log_L_upper_limit (219 steps, 0 retries, all final tolerances pass); fails only rel_num_zones track tolerance (2.28% > 2.0%, first_diverging_step = 82) (#153)."

