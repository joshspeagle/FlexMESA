# Declared known gaps for upstream MESA 26.4.1 test-suite cases (#141, #143, #144).
# Every entry links an open sub-issue of #140 and names the mechanism.
# CI fails on undeclared failures and flags declared gaps that begin passing.
# Measured numbers (run mode, steps, termination, first diverging step, largest
# deviation) are not copied here: they are in the generated
# notes/audit/case_table.md and baseline_run_26_4_1.json. The unsupported
# controls of each case are in notes/audit/unsupported_controls_26_4_1.md.

