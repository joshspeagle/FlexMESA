# SPDX-License-Identifier: GPL-3.0-or-later
# Cases whose manifest `required_termination` is not the `termination code:`
# MESA 26.4.1 printed for the final stage (`#604`, DECISIONS #75). Checked by
# scripts/audit/mesa_terminations.py.
#
# kind:
#   hook_without_code       an extras hook returns terminate and upstream
#                           leaves termination_code unset, so MESA prints no
#                           code; the manifest names the hook.
#   binary_message          the binary module prints its own message as the
#                           code; the manifest names the control.
#   multi_stage_final_hook  as hook_without_code, for the last of several
#                           stages whose earlier stages printed a code.
#   result_reason           the run ends with a `terminated evolution:` reason
#                           and no termination code.
#   after_evolve_code       upstream sets termination_code in
#                           extras_after_evolve, after MESA printed its codes.
#   hook_error_exit         a hook ends the run by returning an error.
#   astero_search_message   the final sample of an astero search ends in
#                           astero_extras_check_model terminating with no
#                           code; the manifest names the FlexMESA search
#                           summary `_term=` code that maps to that message.
#   no_mesa_run             no completed MESA run exists (skipped upstream or
#                           timed out); the value rests on the upstream line.
#
# source:      MESA-root-relative `file:line` at tag 26.4.1.
# source_text: text that must occur on that line (checked at generation).
# message:     text MESA printed, which must occur in the stored out.txt.

