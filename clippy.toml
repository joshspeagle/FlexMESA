# Workspace Clippy configuration (#165 Item 12).
#
# All elementary transcendental, power, hypotenuse, and fused multiply-add
# methods on `f64` are forbidden outside `flexmesa-math` and
# `flexmesa-crlibm-sys` so that every physics and numerical crate routes
# arithmetic through `flexmesa-math` (`NumericsMode::Strict` / `Fast`).

