  { path = "f64::exp", reason = "use `flexmesa_math::exp` (#165)" },
  { path = "f64::exp2", reason = "use `flexmesa_math::pow(2.0, x)` (#165)" },
  { path = "f64::exp_m1", reason = "use `flexmesa_math::expm1` (#165)" },
