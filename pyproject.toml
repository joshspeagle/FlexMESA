[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "flexmesa"
version = "0.1.0"
description = "Modular, differentiable, and memory-safe re-engineering of MESA in Rust and Python/JAX."
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
  { name = "Josh Speagle", email = "j.speagle@utoronto.ca" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "jax>=0.4.30",
  "safetensors>=0.4",
]

[tool.maturin]
python-source = "src"
module-name = "flexmesa._rust"
manifest-path = "crates/flexmesa-py/Cargo.toml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tests"]
addopts = "--doctest-modules --strict-markers -m 'not slow'"
markers = [
  "slow: marks full-grid or multi-step stellar evolution tests (> 5 s)",
]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"jax.numpy" = "jnp"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
