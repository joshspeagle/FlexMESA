[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexmesa"
version = "0.1.0"
description = "Modular, differentiable, and memory-safe re-engineering of MESA in Rust and Python/JAX."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Josh Speagle", email = "j.speagle@utoronto.ca" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "jax>=0.4.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
cache_dir = "/tmp/flexmesa-pytest-cache"
addopts = "--doctest-modules --strict-markers -m 'not slow'"
markers = [
  "slow: marks full-grid or multi-step stellar evolution tests (> 5 s)",
]

[tool.ruff]
line-length = 80
target-version = "py312"
cache-dir = "/tmp/flexmesa-ruff-cache"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"jax.numpy" = "jnp"

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "/tmp/flexmesa-mypy-cache"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
ignore_missing_imports = true
