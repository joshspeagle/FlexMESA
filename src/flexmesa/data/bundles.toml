# FlexMESA Release Data Bundles (DECISIONS #3 & #13)
#
# Maps canonical physics table and upstream verification archives hosted on
# GitHub Releases (`data-v1`) to their SHA-256 checksums, byte sizes, and
# relative extraction targets inside `$FLEXMESA_DATA_DIR`.

[release]
repo = "joshspeagle/FlexMESA"
tag = "data-v1"

[[bundles]]
name = "helm_full"
archive = "helm_table_full.bin.zst"
kind = "single_zst"
